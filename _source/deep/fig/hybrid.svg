<svg viewBox="0 0 400 248" xmlns="http://www.w3.org/2000/svg">
<rect class="fg-story" x="6" y="40" width="96" height="150" rx="12"/>
<text class="fg-c" x="54" y="80" font-size="24">🏢</text>
<text class="fg-tb fg-xs fg-c" x="54" y="104">офіс / каси</text>
<text class="fg-m fg-xs fg-c" x="54" y="122">on-premises</text>
<text class="fg-m fg-xs fg-c" x="54" y="146">Customer</text>
<text class="fg-m fg-xs fg-c" x="54" y="160">Gateway</text>
<rect class="fg-accs" x="120" y="30" width="150" height="70" rx="10"/>
<text class="fg-tb fg-xs" x="130" y="50">🚐 Site-to-Site VPN</text>
<text class="fg-t fg-xs" x="130" y="68">IPsec через інтернет</text>
<text class="fg-t fg-xs" x="130" y="84">за хвилини · 2 тунелі</text>
<rect class="fg-cmp" x="120" y="120" width="150" height="80" rx="10"/>
<text class="fg-tb fg-xs" x="130" y="140">🚆 Direct Connect</text>
<text class="fg-t fg-xs" x="130" y="158">приватна лінія, 1–400 Gbps</text>
<text class="fg-t fg-xs" x="130" y="174">тижні · стабільно</text>
<text class="fg-tbad fg-xs fg-tb" x="130" y="192">не шифрує сам!</text>
<line class="fg-la" x1="104" y1="80" x2="118" y2="66" marker-end="url(#aha)"/>
<line class="fg-l" x1="104" y1="150" x2="118" y2="158" marker-end="url(#ah)"/>
<rect class="fg-ok" x="290" y="70" width="104" height="90" rx="12"/>
<text class="fg-c" x="342" y="100" font-size="18">🔀</text>
<text class="fg-tb fg-xs fg-c" x="342" y="120">Transit</text>
<text class="fg-tb fg-xs fg-c" x="342" y="134">Gateway</text>
<text class="fg-m fg-xs fg-c" x="342" y="150">→ багато VPC</text>
<line class="fg-la" x1="272" y1="66" x2="288" y2="92" marker-end="url(#aha)"/>
<line class="fg-l" x1="272" y1="158" x2="288" y2="138" marker-end="url(#ah)"/>
<text class="fg-m fg-xs" x="6" y="222">шифрування на DX → VPN поверх DX або MACsec</text>
<text class="fg-m fg-xs" x="6" y="240">резерв DX → VPN (дешево) або другий DX в іншій локації</text>
</svg>
