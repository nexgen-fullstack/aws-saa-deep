<svg viewBox="0 0 400 278" xmlns="http://www.w3.org/2000/svg">
<rect class="fg-net" x="140" y="6" width="120" height="58" rx="10"/>
<text class="fg-tb fg-xs fg-c" x="200" y="28">🏦 KMS</text>
<text class="fg-m fg-xs fg-c" x="200" y="46">головний ключ 🔑</text>
<line class="fg-la" x1="200" y1="66" x2="200" y2="88" marker-end="url(#aha)"/>
<text class="fg-tacc fg-xs" x="208" y="82">1. «дай ключ даних»</text>
<rect class="fg-story" x="60" y="92" width="130" height="50" rx="10"/>
<text class="fg-tb fg-xs fg-c" x="125" y="112">🗝️ ключ даних</text>
<text class="fg-m fg-xs fg-c" x="125" y="130">звичайний</text>
<rect class="fg-warn" x="210" y="92" width="130" height="50" rx="10"/>
<text class="fg-tb fg-xs fg-c" x="275" y="112">✉️ ключ даних</text>
<text class="fg-m fg-xs fg-c" x="275" y="130">у «конверті» KMS</text>
<line class="fg-la" x1="125" y1="144" x2="125" y2="170" marker-end="url(#aha)"/>
<text class="fg-tacc fg-xs" x="20" y="162">2. шифрує файл</text>
<rect class="fg-sto" x="40" y="174" width="320" height="56" rx="10"/>
<text class="fg-c" x="80" y="208" font-size="20">🖼️🔒</text>
<text class="fg-tb fg-xs" x="112" y="196">зашифрований файл (гігабайти)</text>
<text class="fg-t fg-xs" x="112" y="214">+ поруч лежить ✉️ «конверт»</text>
<line class="fg-l fg-dash" x1="275" y1="144" x2="275" y2="170" marker-end="url(#ah)"/>
<text class="fg-tbad fg-xs fg-tb" x="20" y="252">3. звичайний ключ одразу забувають</text>
<text class="fg-m fg-xs" x="20" y="270">щоб прочитати: конверт → KMS → ключ → файл</text>
</svg>
