<rect class="fg-ok" x="316.4" y="28" width="75.6" height="34" rx="6"/>
<text class="fg-tok fg-tb fg-xs fg-c" x="354.2" y="50">записуйся!</text>
<text class="fg-m fg-xs " x="6.0" y="78">0%</text>
<text class="fg-m fg-xs fg-c" x="258.2" y="78">65%</text>
