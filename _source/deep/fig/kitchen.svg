<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
<rect class="fg-cmp" x="8" y="10" width="164" height="132" rx="14"/>
<text class="fg-c fg-eb" x="90" y="52">🧑‍🍳</text>
<text class="fg-tb fg-c" x="90" y="82">Процесор (CPU)</text>
<text class="fg-m fg-c" x="90" y="102">кухар:</text>
<text class="fg-m fg-c" x="90" y="119">рахує й виконує</text>
<rect class="fg-net" x="228" y="10" width="164" height="132" rx="14"/>
<text class="fg-c fg-eb" x="310" y="52">🍽️</text>
<text class="fg-tb fg-c" x="310" y="82">Пам'ять (RAM)</text>
<text class="fg-m fg-c" x="310" y="102">стіл: швидко,</text>
<text class="fg-m fg-c" x="310" y="119">але тимчасово</text>
<line class="fg-la" x1="178" y1="76" x2="222" y2="76" marker-start="url(#aha)" marker-end="url(#aha)"/>
<text class="fg-tacc fg-c fg-xs" x="200" y="66">мить</text>
<rect class="fg-sto" x="8" y="184" width="384" height="104" rx="14"/>
<text class="fg-c fg-eb" x="200" y="222">🧊🥫</text>
<text class="fg-tb fg-c" x="200" y="250">Диск (SSD або HDD)</text>
<text class="fg-m fg-c" x="200" y="272">холодильник і комора: повільніше, зате надовго</text>
<line class="fg-l" x1="310" y1="148" x2="310" y2="178" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text class="fg-m fg-xs" x="318" y="167">довше</text>
<text class="fg-m fg-xs fg-c" x="90" y="166">кухар не ходить у комору —</text>
<text class="fg-m fg-xs fg-c" x="90" y="180">бере лише зі столу</text>
</svg>
